# apps.properties
# remote_url 支持 manual:// 前缀，表示该 JAR 由本地手工放置，不走远端下载。
apps=kb-auth,kb-gateway,kb-content,kb-message,kb-search

kb-auth.local_path=./apps/kb-auth/kb-auth-bootstrap.jar
kb-auth.remote_url=manual://kb-auth

kb-gateway.local_path=./apps/kb-gateway/kb-gateway-bootstrap.jar
kb-gateway.remote_url=manual://kb-gateway

kb-content.local_path=./apps/kb-content/kb-content-bootstrap.jar
kb-content.remote_url=manual://kb-content

kb-message.local_path=./apps/kb-message/kb-message-bootstrap.jar
kb-message.remote_url=manual://kb-message

kb-search.local_path=./apps/kb-search/kb-search-bootstrap.jar
kb-search.remote_url=manual://kb-search
