x-common-environment: &common-environment
  TZ: Asia/Shanghai
  SERVER_PORT: "8081"
  APP_PORT: "8081"
  JAVA_OPTS: "-Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom"

x-service-template: &service-template
  image: eclipse-temurin:17-jre
  working_dir: /app
  command: /app/toolkits/startup_springboot.sh
  env_file:
    - env.properties
  restart: always
  deploy:
    resources:
      limits:
        memory: 768m
        cpus: "1.0"
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "3"
  healthcheck:
    test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP' || wget -qO- http://localhost:8081/health | grep -q 'OK\\|UP'" ]
    interval: 20s
    timeout: 10s
    retries: 3
    start_period: 60s

services:
  kb-auth:
    <<: *service-template
    container_name: kb-auth
    environment:
      <<: *common-environment
      SERVICE_NAME: kb-auth
      APP_JAR: kb-auth-bootstrap.jar
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: "48081"
    ports:
      - "48081:8081"
      - "15006:5005"
    volumes:
      - ./apps/kb-auth:/app/kb-auth:ro
      - ./logs/kb-auth:/app/logs
      - ../toolkits:/app/toolkits:ro
      - ./files:/app/files:rw

  kb-gateway:
    <<: *service-template
    container_name: kb-gateway
    environment:
      <<: *common-environment
      SERVICE_NAME: kb-gateway
      APP_JAR: kb-gateway-bootstrap.jar
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: "48080"
    ports:
      - "48080:8081"
      - "15005:5005"
    depends_on:
      kb-auth:
        condition: service_healthy
    volumes:
      - ./apps/kb-gateway:/app/kb-gateway:ro
      - ./logs/kb-gateway:/app/logs
      - ../toolkits:/app/toolkits:ro
      - /sys:/hostser/sys:ro
      - /dev:/hostser/dev:ro
      - /proc:/hostser/proc:ro
      - /run/udev:/run/udev:ro

  kb-content:
    <<: *service-template
    container_name: kb-content
    environment:
      <<: *common-environment
      SERVICE_NAME: kb-content
      APP_JAR: kb-content-bootstrap.jar
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: "48082"
    ports:
      - "48082:8081"
      - "15007:5005"
    depends_on:
      kb-auth:
        condition: service_healthy
    volumes:
      - ./apps/kb-content:/app/kb-content:ro
      - ./logs/kb-content:/app/logs
      - ../toolkits:/app/toolkits:ro

  kb-message:
    <<: *service-template
    container_name: kb-message
    environment:
      <<: *common-environment
      SERVICE_NAME: kb-message
      APP_JAR: kb-message-bootstrap.jar
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: "48083"
    ports:
      - "48083:8081"
      - "15008:5005"
    depends_on:
      kb-auth:
        condition: service_healthy
    volumes:
      - ./apps/kb-message:/app/kb-message:ro
      - ./logs/kb-message:/app/logs
      - ../toolkits:/app/toolkits:ro

  kb-search:
    <<: *service-template
    container_name: kb-search
    environment:
      <<: *common-environment
      SERVICE_NAME: kb-search
      APP_JAR: kb-search-bootstrap.jar
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: "48084"
    ports:
      - "48084:8081"
      - "15009:5005"
    depends_on:
      kb-auth:
        condition: service_healthy
    volumes:
      - ./apps/kb-search:/app/kb-search:ro
      - ./logs/kb-search:/app/logs
      - ../toolkits:/app/toolkits:ro
