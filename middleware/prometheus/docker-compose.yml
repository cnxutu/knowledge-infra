# monitor/docker-compose.yml
services:
  redis-exporter:
    image: docker.1ms.run/oliver006/redis_exporter
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
      - REDIS_PASSWORD=admin123          # 关键！填你的 Redis 密码
    ports:
      - "9121:9121"

  mysqld-exporter:
    image: docker.1ms.run/prom/mysqld-exporter
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.my-cnf=/etc/mysql/my.cnf"
    volumes:
      - ./mysql-exporter.cnf:/etc/mysql/my.cnf:ro
    ports:
      - "9104:9104"

  rocketmq-exporter:
    image: docker.1ms.run/apache/rocketmq-exporter
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ROCKETMQ_CONFIG_NAMESRV_ADDR=host.docker.internal:9876 #利用了springboot的配置重载的特性， rocketmq:config:namesrvAddr: 127.0.0.1:9876
    ports:
      - "5557:5557"

  prometheus:
    image: docker.1ms.run/prom/prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # 👇 新增：Grafana 可视化
  grafana:
    image: docker.1ms.run/grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123  # 默认用户名 admin，密码设为 admin123
      - GF_USERS_ALLOW_SIGN_UP=false         # 禁止注册
    volumes:
      - grafana-storage:/var/lib/grafana     # 持久化仪表盘和配置
    restart: unless-stopped

# 定义数据卷（持久化 Grafana 配置）
volumes:
  grafana-storage:
