user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen   80;
	# listen   127.0.0.1:80;
	# listen   192.168.1.108:80;
	server_name  192.168.1.108;  # 或 192.168.1.112，根据需要

        client_max_body_size 50M;

        # API 代理
        location /biz-api/ {
            proxy_pass http://192.168.1.108:48080/admin-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

	# API 代理
        location ~ /admin-api/ {
	    # proxy_pass http://192.168.1.108:48080/admin-api/;
            proxy_pass http://192.168.1.108:48080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # 主应用（通过 /vmicro-app-main/ 访问）
        location /vmicro-app-main/ {
            alias /usr/share/nginx/html/vmicro-app-main/;
            index index.html;
            try_files $uri $uri/ /vmicro-app-main/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 登录子应用
        location /vmicro-app-login/ {
            alias /usr/share/nginx/html/vmicro-app-login/;
            index index.html;
            try_files $uri $uri/ /vmicro-app-login/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 飞控中心子应用
        location /vmicro-app-fly-ctrl/ {
            alias /usr/share/nginx/html/vmicro-app-fly-ctrl/;
            index index.html;
            try_files $uri $uri/ /vmicro-app-fly-ctrl/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 飞控配置子应用
        location /vmicro-app-resource/ {
            alias /usr/share/nginx/html/vmicro-app-resource/;
            index index.html;
            try_files $uri $uri/ /vmicro-app-resource/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 系统配置子应用
        location /vmicro-app-system/ {
            alias /usr/share/nginx/html/vmicro-app-system/;
            index index.html;
            try_files $uri $uri/ /vmicro-app-system/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

	# 基础设施子应用
        location /vmicro-app-base-ctrl/ {
            alias /usr/share/nginx/html/vmicro-app-base-ctrl/;
            index index.html;
            try_files $uri $uri/ /vmicro-app-base-ctrl/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Cesium：系统配置子应用
        location /vmicro-app-system/cesium/ {
            alias /usr/share/nginx/html/vmicro-app-system/cesium/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cesium：飞控中心子应用
        location /vmicro-app-fly-ctrl/cesium/ {
            alias /usr/share/nginx/html/vmicro-app-fly-ctrl/cesium/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        #添加地图禁飞区域静态资源的配置
        location /geojson/ {
            alias /usr/share/nginx/html/map/geojson/;
            # 允许跨域访问（部分浏览器加载 Worker 可能需要）
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            # 静态资源缓存
            expires 1y;
            add_header Cache-Control "public, immutable";
         }

        location /static-resource/ {
            alias /usr/share/nginx/html/static-resource/;
            # 允许跨域访问（部分浏览器加载 Worker 可能需要）
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            # 静态资源缓存
            expires 1y;
            add_header Cache-Control "public, immutable";
         }

        # 默认首页重定向到主应用（保留你原来的需求）
        location = / {
            return 301 /vmicro-app-main/;
        }
    }
}
