services:
  mysql:
    image: docker.1ms.run/mysql:5.7
    container_name: mysql
    ports:
      - 3306:3306
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/log:/var/log/mysql
      - ./mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - ./mysql/initdb:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: star-pro-base-cloud
      MYSQL_ROOT_PASSWORD: admin123
    command:
      [
        'mysqld',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--default-time-zone=+8:00',
        '--lower-case-table-names=1'
      ]
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=admin123" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    stop_grace_period: 60s

  nacos:
    image: docker.1ms.run/nacos/nacos-server:v2.5.1
    container_name: nacos
    ports:
      - 8848:8848
      - 9848:9848
    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: true  # 启用鉴权
      NACOS_AUTH_TOKEN: "VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg="  # 添加 Token
      NACOS_AUTH_IDENTITY_KEY: "nacos"  # 设置身份标识 Key
      NACOS_AUTH_IDENTITY_VALUE: "nacos" # 设置身份标识 Value
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: admin123
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8848/nacos/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: docker.1ms.run/nginx:stable
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/log:/var/log/nginx
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "2"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost/" ]
      interval: 20s
      timeout: 5s
      retries: 2
      start_period: 10s

  redis:
    image: docker.1ms.run/redis:7.4.3
    container_name: redis_star_pro_base_cloud
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
      - ./redis/logs:/logs
      - ./redis/conf:/usr/local/etc/redis/
    command: [ '--requirepass admin123' ]
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "admin123", "ping" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  rocketmq-namesrv:
    image: docker.1ms.run/apache/rocketmq:5.1.4
    container_name: local-rocketmq-namesrv
    ports:
      - "9876:9876"
    volumes:
      - ./rocketmq/data/namesrv/logs:/home/rocketmq/logs
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    networks:
      - rocketmq-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '1.0'
    healthcheck:
      test: >
        bash -c '
          /home/rocketmq/rocketmq-5.1.4/bin/mqadmin clusterList -n localhost:9876 >/dev/null 2>&1
        '
      interval: 20s
      timeout: 20s
      retries: 3
      start_period: 30s

  rocketmq-broker:
    image: docker.1ms.run/apache/rocketmq:5.1.4
    container_name: local-rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    depends_on:
      - rocketmq-namesrv
    volumes:
      - ./rocketmq/data/broker/logs:/home/rocketmq/logs
      - ./rocketmq/data/broker/store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -Xms1g -Xmx1g -Xmn512m"
    networks:
      - rocketmq-net
    restart: always
    healthcheck:
      test: >
        bash -c '
          /home/rocketmq/rocketmq-5.1.4/bin/mqadmin brokerStatus
          -n rocketmq-namesrv:9876
          -b 192.168.1.108:10911
          >/dev/null 2>&1
        '
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  rocketmq-console:
    image: docker.1ms.run/apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: local-rocketmq-console
    ports:
      - "6060:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    networks:
      - rocketmq-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  tdengine:
    image: docker.1ms.run/tdengine/tdengine:3.3.6.13  # 使用最新稳定版
    container_name: tdengine
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    ports:
      - "6030:6030"   # RESTful API (HTTP)
      - "6041:6041"   # Native client port (JDBC/ODBC)
    volumes:
      - ./tdengine/data:/var/lib/taos    # 持久化数据
      - ./tdengine/logs:/var/log/taos    # 持久化日志
      - ./tdengine/taos.cfg:/etc/taos/taos.cfg
    environment:
      - TAOS_FQDN=localhost     # 关键！宿主机连接需设为 localhost

networks:
  rocketmq-net:
    driver: bridge
