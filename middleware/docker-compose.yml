services:
  mysql:
    image: mysql:8.0.37
    container_name: knowledge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Win@2026!
      MYSQL_DATABASE: nacos_config
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=300
      - --lower_case_table_names=1
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/log:/var/log/mysql
      - ./mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - ./mysql/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=Win@2026!" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7.2
    container_name: knowledge-redis
    restart: always
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - Redis@123
      - --appendonly
      - yes
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
    volumes:
      - ./redis/data:/data
      - ./redis/logs:/logs
      - ./redis/conf:/usr/local/etc/redis/
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "Redis@123", "ping" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: knowledge-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:9200/_cluster/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  nacos:
    image: nacos/nacos-server:v2.2.0.1
    platform: linux/amd64
    container_name: knowledge-nacos
    restart: always
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=Win@2026!
      - NACOS_AUTH_ENABLE=true
      - NACOS_CORE_AUTH_PLUGIN_NACOS_TOKEN_SECRET_KEY=KnowledgeHubNacosJwtSecretKey1234567890
      - NACOS_CORE_AUTH_SERVER_IDENTITY_KEY=serverIdentity
      - NACOS_CORE_AUTH_SERVER_IDENTITY_VALUE=knowledge-hub
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8848/nacos/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27.2-alpine
    container_name: knowledge-nginx
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/log:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost/" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: knowledge-rocketmq-namesrv
    restart: always
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    ports:
      - "9876:9876"
    volumes:
      - ./rocketmq/data/namesrv/logs:/home/rocketmq/logs
    networks:
      - rocketmq-net
    healthcheck:
      test: [ "CMD-SHELL", "/home/rocketmq/rocketmq-5.1.4/bin/mqadmin clusterList -n localhost:9876 >/dev/null 2>&1" ]
      interval: 20s
      timeout: 20s
      retries: 3
      start_period: 30s

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: knowledge-rocketmq-broker
    restart: always
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -Xms1g -Xmx1g -Xmn512m"
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./rocketmq/data/broker/logs:/home/rocketmq/logs
      - ./rocketmq/data/broker/store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    networks:
      - rocketmq-net

  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: knowledge-rocketmq-console
    restart: always
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "6060:8080"
    networks:
      - rocketmq-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  rocketmq-net:
    driver: bridge
