services:
  xxl-job-admin:
    image: docker.1ms.run/xuxueli/xxl-job-admin:3.3.2
    container_name: xxl-job-admin
    restart: unless-stopped
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://192.168.1.108:3306/xxljob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=admin123
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
        --server.port=9090
        --xxl.job.accessToken=xmkj
        --xxl.job.executor.appname=xxl-job-executor
        --xxl.job.executor.logpath=/data/applogs/xxl-job/jobhandler
        --xxl.job.executor.logretentiondays=30
    ports:
      - "9090:9090"
    volumes:
      - ./logs:/data/applogs/xxl-job

#
#        默认账号：admin
#        默认密码：123456
